plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.devopener'
    compileSdk 34

    // Llave de firma fija: así cada versión nueva se instala encima de la anterior.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'jks'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.example.milauncher'
        minSdk 21
        // 22: en Android 6 los permisos (leer la carpeta Fondos) se conceden al instalar.
        targetSdk 22
        versionCode 6
        versionName '6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
